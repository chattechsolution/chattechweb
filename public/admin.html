<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("SW registered"))
                    .catch(err => console.log("SW registration failed:", err));
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Chat Tech Solutions</title>

    <!-- PWA Meta tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0891b2">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Chat+Tech&background=0891b2&color=fff&size=192">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#f8f9fb',
                        'bg-secondary': '#ffffff',
                        'bg-glass': 'rgba(255, 255, 255, 0.65)',
                        'accent-cyan': '#0891b2',
                        'accent-purple': '#7c3aed',
                        'text-primary': '#0f172a',
                        'text-secondary': '#475569',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React 18 & Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-primary: #f8f9fb;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.65);
            --accent-cyan: #0891b2;
            --accent-purple: #7c3aed;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: perspective(1000px) rotateX(1deg) rotateY(1deg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: white;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function AdminDashboard() {
            const [activeTab, setActiveTab] = useState('overview');
            const [stats, setStats] = useState({ total_clients: 0, pending_revenue: 0 });
            const [clients, setClients] = useState([]);
            const [staff, setStaff] = useState([]);
            const [financials, setFinancials] = useState({ total_revenue: 0, total_expenses: 0, profit: 0, profit_margin: 0, expenses: [] });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                checkAuth();
                fetchStats();
                fetchClients();
                fetchStaff();
                fetchFinancials();
            }, []);

            const fetchStaff = async () => {
                const res = await fetch('../api/admin_api.php?action=staff');
                if (res.ok) setStaff(await res.json());
            };

            const checkAuth = async () => {
                const res = await fetch('../api/auth.php');
                const data = await res.json();
                if (!res.ok || (data.user && data.user.role) !== 'admin') {
                    window.location.href = 'login.html';
                }
            };

            const fetchStats = async () => {
                const res = await fetch('../api/admin_api.php?action=stats');
                const data = await res.json();
                if (res.ok) setStats(data);
            };

            const fetchClients = async () => {
                const res = await fetch('../api/admin_api.php?action=clients');
                const data = await res.json();
                if (res.ok) setClients(data);
                setLoading(false);
            };

            const fetchFinancials = async () => {
                const res = await fetch('../api/admin_api.php?action=financials');
                const data = await res.json();
                if (res.ok) setFinancials(data);
            };

            const handleLogout = async () => {
                await fetch('../api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'logout' })
                });
                window.location.href = 'login.html';
            };

            return (
                <div className="flex h-screen w-full relative">
                    {/* Background acccents */}
                    <div className="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-accent-cyan/5 blur-[120px] z-0 pointer-events-none"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-accent-purple/5 blur-[120px] z-0 pointer-events-none"></div>

                    {/* Sidebar */}
                    <div className="w-64 glass-sidebar text-slate-800 flex flex-col z-20 shadow-xl">
                        <div className="p-6">
                            <h2 className="text-2xl font-heading font-bold gradient-text">Chat Tech</h2>
                            <p className="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Admin Portal</p>
                        </div>
                        <nav className="flex-1 px-4 space-y-2 mt-4">
                            <button
                                onClick={() => setActiveTab('overview')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'overview' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-home w-6 mr-3 text-center"></i> Overview
                            </button>
                            <button
                                onClick={() => setActiveTab('roster')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'roster' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-users w-6 mr-3 text-center"></i> Client Roster
                            </button>
                            <button
                                onClick={() => setActiveTab('staff')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'staff' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-user-shield w-6 mr-3 text-center"></i> Staff Management
                            </button>
                            <button
                                onClick={() => setActiveTab('financials')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'financials' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-chart-line w-6 mr-3 text-center"></i> Financials
                            </button>
                            <button
                                onClick={() => setActiveTab('pos')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'pos' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-cash-register w-6 mr-3 text-center"></i> POS Terminal
                            </button>
                            <button
                                onClick={() => setActiveTab('projects')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'projects' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-columns w-6 mr-3 text-center"></i> Project Board
                            </button>
                            <button
                                onClick={() => setActiveTab('support')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'support' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-life-ring w-6 mr-3 text-center"></i> Support Desk
                            </button>
                            <button
                                onClick={() => setActiveTab('analytics')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'analytics' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-chart-bar w-6 mr-3 text-center"></i> Analytics
                            </button>
                            <button
                                onClick={() => setActiveTab('settings')}
                                className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === 'settings' ? 'bg-slate-100 text-accent-cyan font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                            >
                                <i className="fas fa-cog w-6 mr-3 text-center"></i> Settings
                            </button>
                        </nav>
                        <div className="p-4 border-t border-slate-100">
                            <button onClick={handleLogout} className="w-full flex items-center px-4 py-3 text-rose-500 hover:bg-rose-50 hover:text-rose-600 rounded-xl transition font-medium">
                                <i className="fas fa-sign-out-alt w-6 mr-3 text-center"></i> Logout
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden z-10">
                        <header className="bg-white/80 backdrop-blur-md shadow-sm px-8 py-5 flex justify-between items-center z-10 border-b border-slate-200/50">
                            <h1 className="text-2xl font-heading font-semibold text-text-primary capitalize">{activeTab.replace('_', ' ')}</h1>
                            <div className="flex items-center space-x-4">
                                <div className="h-10 w-10 rounded-full btn-primary flex items-center justify-center font-bold shadow-md">
                                    A
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-x-hidden overflow-y-auto p-8">
                            {loading ? (
                                <div className="flex justify-center items-center h-64">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-accent-cyan"></div>
                                </div>
                            ) : (
                                <div className="max-w-6xl mx-auto">
                                    {activeTab === 'overview' && <Overview stats={stats} />}
                                    {activeTab === 'roster' && <ClientRoster clients={clients} fetchClients={fetchClients} />}
                                    {activeTab === 'staff' && <StaffManagement />}
                                    {activeTab === 'financials' && <Financials financials={financials} refresh={fetchFinancials} />}
                                    {activeTab === 'pos' && <POSTerminal clients={clients} />}
                                    {activeTab === 'projects' && <ProjectBoard staff={staff} />}
                                    {activeTab === 'support' && <SupportDesk />}
                                    {activeTab === 'analytics' && <AdvancedAnalytics />}
                                    {activeTab === 'settings' && <GlobalSettings />}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        function POSTerminal({ clients }) {
            const [formData, setFormData] = useState({ client_id: '', amount: '', description: '', payment_method: 'cash' });
            const [message, setMessage] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'pos_checkout', ...formData })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    setMessage(`Success! Invoice #${data.invoice_id} generated and marked as paid.`);
                    setFormData({ client_id: '', amount: '', description: '', payment_method: 'cash' });
                } else {
                    setMessage('Error: ' + (data.error || 'Checkout failed'));
                }
            };

            return (
                <div className="max-w-2xl mx-auto glass-card rounded-2xl p-8">
                    <h2 className="text-2xl font-heading font-semibold mb-2 text-text-primary"><i className="fas fa-cash-register text-accent-cyan mr-3"></i>Point of Sale</h2>
                    <p className="text-text-secondary mb-8">Quickly ring up a client and generate an instant paid invoice.</p>

                    {message && (
                        <div className={`mb-6 p-4 rounded-xl border ${message.includes('Error') ? 'bg-rose-50/80 border-rose-200 text-rose-600' : 'bg-emerald-50/80 border-emerald-200 text-emerald-600'}`}>
                            {message}
                        </div>
                    )}

                    <form onSubmit={handleSubmit} className="space-y-5">
                        <div>
                            <label className="block text-sm font-medium text-text-primary mb-2">Select Client</label>
                            <select required value={formData.client_id} onChange={e => setFormData({...formData, client_id: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition">
                                <option value="">-- Choose Client --</option>
                                {clients.map(c => <option key={c.id} value={c.id}>{c.name} ({c.email})</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-text-primary mb-2">Description</label>
                            <input type="text" required value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition" placeholder="e.g. Website Maintenance Retainer" />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-text-primary mb-2">Amount ($)</label>
                                <input type="number" step="0.01" required value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-text-primary mb-2">Payment Method</label>
                                <select value={formData.payment_method} onChange={e => setFormData({...formData, payment_method: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition">
                                    <option value="cash">Cash</option>
                                    <option value="bank_transfer">Bank Transfer</option>
                                    <option value="card_terminal">Card Terminal (External)</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" className="btn-primary mt-4 w-full py-4 font-bold text-lg rounded-xl shadow-lg uppercase tracking-wide">
                            Complete Checkout
                        </button>
                    </form>
                </div>
            );
        }

        function ProjectBoard({ staff }) {
            const [tasks, setTasks] = useState([]);
            const [view, setView] = useState('board');
            const [formData, setFormData] = useState({ id: '', title: '', description: '', status: 'To Do', assigned_to: '' });

            const fetchTasks = async () => {
                const res = await fetch('../api/admin_api.php?action=projects');
                if (res.ok) setTasks(await res.json());
            };

            useEffect(() => { fetchTasks(); }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create_task', ...formData })
                });
                if (res.ok) {
                    setView('board');
                    fetchTasks();
                }
            };

            const handleStatusChange = async (id, newStatus) => {
                await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'update_task', id, status: newStatus })
                });
                fetchTasks();
            };

            if (view === 'add') {
                return (
                    <div className="max-w-2xl mx-auto glass-card rounded-2xl p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-heading font-semibold text-text-primary">Create Task</h2>
                            <button onClick={() => setView('board')} className="text-text-secondary hover:text-text-primary">Cancel</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div><label className="block text-sm font-medium text-text-primary mb-2">Title</label><input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition" /></div>
                            <div><label className="block text-sm font-medium text-text-primary mb-2">Description</label><textarea rows="3" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition"></textarea></div>
                            <div>
                                <label className="block text-sm font-medium text-text-primary mb-2">Assign To</label>
                                <select value={formData.assigned_to} onChange={e => setFormData({...formData, assigned_to: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition">
                                    <option value="">-- Unassigned --</option>
                                    {staff.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                            </div>
                            <button type="submit" className="btn-primary mt-4 w-full py-4 font-semibold rounded-xl shadow-lg">Save Task</button>
                        </form>
                    </div>
                );
            }

            const columns = ['To Do', 'In Progress', 'Done'];

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-heading font-semibold text-text-primary">Project Kanban</h2>
                        <button onClick={() => { setFormData({ id: '', title: '', description: '', status: 'To Do', assigned_to: '' }); setView('add'); }} className="btn-primary px-5 py-2 text-sm font-semibold rounded-lg shadow">New Task</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {columns.map(col => (
                            <div key={col} className="bg-slate-100/50 rounded-2xl p-4 min-h-[500px] border border-slate-200/50">
                                <h3 className="font-heading font-bold text-text-primary mb-4 pb-2 border-b border-slate-200 uppercase tracking-wide text-sm">{col} <span className="ml-2 text-xs bg-white text-slate-500 px-2 py-1 rounded-full shadow-sm">{tasks.filter(t => t.status === col).length}</span></h3>
                                <div className="space-y-4">
                                    {tasks.filter(t => t.status === col).map(task => (
                                        <div key={task.id} className="bg-white rounded-xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition">
                                            <h4 className="font-bold text-text-primary mb-2">{task.title}</h4>
                                            {task.description && <p className="text-sm text-text-secondary mb-4 line-clamp-3">{task.description}</p>}
                                            <div className="flex justify-between items-center mt-4 pt-3 border-t border-slate-50">
                                                <div className="flex items-center">
                                                    {task.assigned_to ? (
                                                        <span className="text-xs font-semibold bg-accent-cyan/10 text-accent-cyan px-2 py-1 rounded-lg truncate max-w-[100px]">{task.assignee_name}</span>
                                                    ) : (
                                                        <span className="text-xs text-slate-400 italic">Unassigned</span>
                                                    )}
                                                </div>
                                                <select
                                                    value={task.status}
                                                    onChange={e => handleStatusChange(task.id, e.target.value)}
                                                    className="text-xs bg-slate-50 border border-slate-200 rounded p-1 outline-none font-medium"
                                                >
                                                    {columns.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SupportDesk() {
            const [tickets, setTickets] = useState([]);
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [replyText, setReplyText] = useState('');

            const fetchTickets = async () => {
                const res = await fetch('../api/admin_api.php?action=tickets');
                if (res.ok) setTickets(await res.json());
            };

            useEffect(() => { fetchTickets(); }, []);

            const handleReply = async (e) => {
                e.preventDefault();
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reply_ticket', id: selectedTicket.id, admin_reply: replyText, status: 'closed' })
                });
                if (res.ok) {
                    setSelectedTicket(null);
                    setReplyText('');
                    fetchTickets();
                }
            };

            if (selectedTicket) {
                return (
                    <div className="max-w-3xl mx-auto glass-card rounded-2xl p-8">
                        <div className="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                            <h2 className="text-2xl font-heading font-semibold text-text-primary">Ticket #{selectedTicket.id}</h2>
                            <button onClick={() => setSelectedTicket(null)} className="text-text-secondary hover:text-text-primary">Back to List</button>
                        </div>
                        <div className="mb-6">
                            <p className="text-sm text-text-secondary uppercase tracking-wider font-bold mb-1">Subject</p>
                            <h3 className="text-xl font-bold text-text-primary mb-4">{selectedTicket.subject}</h3>

                            <p className="text-sm text-text-secondary uppercase tracking-wider font-bold mb-1">Client Name</p>
                            <p className="text-text-primary mb-4">{selectedTicket.client_name}</p>

                            <p className="text-sm text-text-secondary uppercase tracking-wider font-bold mb-1">Message</p>
                            <div className="bg-slate-50 border border-slate-100 p-4 rounded-xl text-text-primary whitespace-pre-wrap">{selectedTicket.message}</div>
                        </div>

                        {selectedTicket.status === 'open' ? (
                            <form onSubmit={handleReply} className="mt-8 border-t border-slate-100 pt-6">
                                <label className="block text-sm font-medium text-text-primary mb-2">Send Reply & Close Ticket</label>
                                <textarea required rows="5" value={replyText} onChange={e => setReplyText(e.target.value)} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition"></textarea>
                                <button type="submit" className="btn-primary mt-4 px-6 py-3 font-semibold rounded-xl shadow-lg">Submit Reply</button>
                            </form>
                        ) : (
                            <div className="mt-8 border-t border-slate-100 pt-6">
                                <p className="text-sm text-text-secondary uppercase tracking-wider font-bold mb-2">Admin Reply</p>
                                <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-emerald-800 whitespace-pre-wrap">{selectedTicket.admin_reply}</div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="glass-card rounded-2xl overflow-hidden">
                    <div className="p-6 border-b border-slate-100/50">
                        <h2 className="text-xl font-heading font-semibold text-text-primary">Support Desk</h2>
                    </div>
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="bg-slate-50/50 border-b border-slate-200/50 text-text-secondary text-sm uppercase tracking-wide">
                                <th className="p-5 font-semibold">Client</th>
                                <th className="p-5 font-semibold">Subject</th>
                                <th className="p-5 font-semibold">Status</th>
                                <th className="p-5 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {tickets.map(ticket => (
                                <tr key={ticket.id} className="border-b border-slate-100/50 hover:bg-slate-50/50 transition">
                                    <td className="p-5 font-medium text-text-primary">{client.name}{client.status === 'suspended' && <span className="ml-2 text-xs bg-rose-100 text-rose-600 px-2 py-1 rounded-full">Suspended</span>}</td>
                                    <td className="p-5 text-text-secondary">{client.email}</td>
                                    <td className="p-5 text-right space-x-3">
                                        <button onClick={() => handleEdit(client)} className="text-accent-cyan hover:underline font-medium text-sm">Edit</button>
                                         className="text-amber-500 hover:underline font-medium text-sm">Suspend</button>}


                                         {client.status !== 'suspended' && <button onClick={() => handleSuspend(client.id)} className="text-amber-500 hover:underline font-medium text-sm mr-3">Suspend</button>}<button onClick={() => handleDelete(client.id)} className="text-rose-500 hover:underline font-medium text-sm">Delete</button>
                                    </td>
                                </tr>
                            ))}
                            {clients.length === 0 && <tr><td colSpan="3" className="p-10 text-center text-text-secondary">No clients found.</td></tr>}
                        </tbody>
                    </table>
                </div>
            );
        }

        function StaffManagement() {
            const [staff, setStaff] = useState([]);
            const [view, setView] = useState('list');
            const [formData, setFormData] = useState({ id: '', name: '', email: '', password: '', role: 'staff' });

            const fetchStaff = async () => {
                const res = await fetch('../api/admin_api.php?action=staff');
                if (res.ok) setStaff(await res.json());
            };

            useEffect(() => { fetchStaff(); }, [view]);


            const handleSuspend = async (id) => {
                if(!confirm("Suspend this client?")) return;
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'suspend_client', id })
                });
                if(res.ok) fetchClients();
            };

            const handleDelete = async (id) => {
                if(!confirm("Are you sure you want to delete this staff member?")) return;
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete_staff', id })
                });
                if(res.ok) fetchStaff();
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const action = formData.id ? 'update_staff' : 'create_staff';
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...formData })
                });
                if (res.ok) setView('list');
            };

            if (view === 'add') {
                return (
                    <div className="max-w-2xl mx-auto glass-card rounded-2xl p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-heading font-semibold text-text-primary">{formData.id ? 'Edit Staff' : 'Add Staff'}</h2>
                            <button onClick={() => setView('list')} className="text-text-secondary hover:text-text-primary">Cancel</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div><label className="block text-sm font-medium text-text-primary mb-2">Name</label><input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition" /></div>
                            <div><label className="block text-sm font-medium text-text-primary mb-2">Email</label><input type="email" required value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition" /></div>
                            <div>
                                <label className="block text-sm font-medium text-text-primary mb-2">Role</label>
                                <select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition">
                                    <option value="staff">Staff</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <div><label className="block text-sm font-medium text-text-primary mb-2">{formData.id ? 'New Password (Optional)' : 'Password'}</label><input type="password" required={!formData.id} value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition" /></div>
                            <button type="submit" className="btn-primary mt-4 w-full py-4 font-semibold rounded-xl shadow-lg">Save</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="glass-card rounded-2xl overflow-hidden">
                    <div className="flex justify-between items-center p-6 border-b border-slate-100/50">
                        <h2 className="text-xl font-heading font-semibold text-text-primary">Staff Management</h2>
                        <button onClick={() => { setFormData({ id: '', name: '', email: '', password: '', role: 'staff' }); setView('add'); }} className="btn-primary px-4 py-2 text-sm font-semibold rounded-lg">Add Staff</button>
                    </div>
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="bg-slate-50/50 border-b border-slate-200/50 text-text-secondary text-sm uppercase tracking-wide">
                                <th className="p-5 font-semibold">Name</th>
                                <th className="p-5 font-semibold">Email</th>
                                <th className="p-5 font-semibold">Role</th>
                                <th className="p-5 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {staff.map(s => (
                                <tr key={s.id} className="border-b border-slate-100/50 hover:bg-slate-50/50 transition">
                                    <td className="p-5 font-medium text-text-primary">{s.name}</td>
                                    <td className="p-5 text-text-secondary">{s.email}</td>
                                    <td className="p-5 text-text-secondary uppercase text-xs font-bold">{s.role}</td>
                                    <td className="p-5 text-right space-x-3">
                                        <button onClick={() => { setFormData({ id: s.id, name: s.name, email: s.email, role: s.role, password: '' }); setView('add'); }} className="text-accent-cyan hover:underline font-medium text-sm">Edit</button>
                                        <button onClick={() => handleDelete(s.id)} className="text-rose-500 hover:underline font-medium text-sm">Delete</button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function Financials({ financials, refresh }) {
            const [formData, setFormData] = useState({ description: '', amount: '', date: '' });
            const [message, setMessage] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create_expense', ...formData })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    setMessage('Expense logged successfully!');
                    setFormData({ description: '', amount: '', date: '' });
                    refresh();
                } else {
                    setMessage('Error: ' + (data.error || 'Failed to log expense'));
                }
            };

            return (
                <div className="space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="glass-card rounded-2xl p-6 border-l-4 border-l-emerald-500">
                            <h3 className="text-text-secondary text-sm font-medium mb-1 uppercase tracking-wide">Total Revenue</h3>
                            <p className="text-3xl font-heading font-bold text-text-primary">${parseFloat(financials.total_revenue || 0).toFixed(2)}</p>
                        </div>
                        <div className="glass-card rounded-2xl p-6 border-l-4 border-l-rose-500">
                            <h3 className="text-text-secondary text-sm font-medium mb-1 uppercase tracking-wide">Total Expenses</h3>
                            <p className="text-3xl font-heading font-bold text-text-primary">${parseFloat(financials.total_expenses || 0).toFixed(2)}</p>
                        </div>
                        <div className="glass-card rounded-2xl p-6 border-l-4 border-l-accent-purple">
                            <h3 className="text-text-secondary text-sm font-medium mb-1 uppercase tracking-wide">Net Profit</h3>
                            <p className="text-3xl font-heading font-bold text-text-primary">${parseFloat(financials.profit || 0).toFixed(2)}</p>
                        </div>
                        <div className="glass-card rounded-2xl p-6 border-l-4 border-l-accent-cyan">
                            <h3 className="text-text-secondary text-sm font-medium mb-1 uppercase tracking-wide">Profit Margin</h3>
                            <p className="text-3xl font-heading font-bold text-text-primary">{parseFloat(financials.profit_margin || 0).toFixed(1)}%</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-1">
                            <div className="glass-card rounded-2xl p-6">
                                <h2 className="text-xl font-heading font-semibold mb-5 text-text-primary">Log Expense</h2>
                                {message && (
                                    <div className={`mb-4 p-3 rounded-lg text-sm border ${message.includes('Error') ? 'bg-rose-50/80 border-rose-200 text-rose-600' : 'bg-emerald-50/80 border-emerald-200 text-emerald-600'}`}>
                                        {message}
                                    </div>
                                )}
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-text-primary mb-1">Description</label>
                                        <input type="text" required value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-4 py-2 bg-white/70 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent-cyan outline-none transition" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-text-primary mb-1">Amount ($)</label>
                                        <input type="number" step="0.01" required value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full px-4 py-2 bg-white/70 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent-cyan outline-none transition" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-text-primary mb-1">Date</label>
                                        <input type="date" required value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full px-4 py-2 bg-white/70 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent-cyan outline-none transition" />
                                    </div>
                                    <button type="submit" className="w-full btn-primary py-3 rounded-lg font-semibold mt-2">Log Expense</button>
                                </form>
                            </div>
                        </div>

                        <div className="lg:col-span-2">
                            <div className="glass-card rounded-2xl overflow-hidden h-full">
                                <div className="p-6 border-b border-slate-100/50">
                                    <h2 className="text-xl font-heading font-semibold text-text-primary">Recent Expenses</h2>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50/50 text-text-secondary text-sm uppercase tracking-wide">
                                                <th className="p-4 font-semibold">Date</th>
                                                <th className="p-4 font-semibold">Description</th>
                                                <th className="p-4 font-semibold">Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {financials.expenses.length === 0 ? (
                                                <tr><td colSpan="3" className="p-8 text-center text-text-secondary">No expenses logged.</td></tr>
                                            ) : (
                                                financials.expenses.map(exp => (
                                                    <tr key={exp.id} className="border-t border-slate-100/50 hover:bg-slate-50/50 transition">
                                                        <td className="p-4 text-text-secondary">{new Date(exp.expense_date).toLocaleDateString()}</td>
                                                        <td className="p-4 font-medium text-text-primary">{exp.description}</td>
                                                        <td className="p-4 font-bold text-rose-600">${parseFloat(exp.amount).toFixed(2)}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function GlobalSettings() {
            const [settings, setSettings] = useState({ razorpay_key_id: '', razorpay_key_secret: '' });
            const [message, setMessage] = useState('');

            useEffect(() => {
                fetch('../api/admin_api.php?action=settings')
                    .then(res => res.json())
                    .then(data => {
                        if (data && !data.error) {
                            setSettings({
                                razorpay_key_id: data.razorpay_key_id || '',
                                razorpay_key_secret: data.razorpay_key_secret || ''
                            });
                        }
                    });
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const res = await fetch('../api/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save_settings', ...settings })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    setMessage('Settings saved successfully!');
                } else {
                    setMessage('Error saving settings.');
                }
            };

            return (
                <div className="max-w-2xl glass-card rounded-2xl p-8">
                    <h2 className="text-2xl font-heading font-semibold mb-2 text-text-primary">Payment Gateway Integration</h2>
                    <p className="text-text-secondary mb-8">Configure your Razorpay API keys to accept client payments.</p>

                    {message && (
                        <div className={`mb-6 p-4 rounded-xl border ${message.includes('Error') ? 'bg-rose-50/80 border-rose-200 text-rose-600' : 'bg-emerald-50/80 border-emerald-200 text-emerald-600'}`}>
                            {message}
                        </div>
                    )}

                    <form onSubmit={handleSubmit} className="space-y-5">
                        <div>
                            <label className="block text-sm font-medium text-text-primary mb-2">Razorpay Key ID</label>
                            <input
                                type="text" required
                                value={settings.razorpay_key_id} onChange={e => setSettings({...settings, razorpay_key_id: e.target.value})}
                                className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition font-mono text-sm"
                                placeholder="rzp_test_..."
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-text-primary mb-2">Razorpay Key Secret</label>
                            <input
                                type="password" required
                                value={settings.razorpay_key_secret} onChange={e => setSettings({...settings, razorpay_key_secret: e.target.value})}
                                className="w-full px-5 py-3 bg-white/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent-cyan outline-none transition font-mono text-sm"
                            />
                        </div>
                        <button type="submit" className="btn-primary mt-4 px-8 py-3 font-semibold rounded-xl shadow-lg">
                            Save Settings
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
